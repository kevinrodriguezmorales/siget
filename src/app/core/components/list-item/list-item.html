<div class="list-item">
  <div class="list-item__wrapper">
    <div class="list-item__leading">
      <ng-content select="[listItemIcon]"></ng-content>
    </div>
    <div class="list-item__data">
      <span class="label-small overline">
        <ng-content select="[listItemOverline]"></ng-content>
      </span>
      <span class="body-large">
        <ng-content select="[listItemTitle]"></ng-content>
      </span>
      <span class="body-medium supporting">
        <ng-content select="[listItemSupporting]"></ng-content>
      </span>
    </div>
  </div>
</div>
