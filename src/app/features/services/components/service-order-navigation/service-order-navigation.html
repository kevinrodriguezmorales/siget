<button class="main-option" matFab extended [matMenuTriggerFor]="staffContext">
  <mat-icon>add_2</mat-icon>
  Crear
</button>

<div class="submenu">
  @for (item of menuItems; track item.route) {
  <button class="submenu-item" mat-button [routerLink]="item.route" routerLinkActive="active">
    <span class="material-symbols">
      {{ item.icon }}
    </span>

    {{ item.label }}
  </button>
  }
</div>

<mat-menu #staffContext="matMenu">
  <button mat-menu-item (click)="navigate('crear-empleado')">Empleado</button>
  <button mat-menu-item>Usuario</button>
</mat-menu>
